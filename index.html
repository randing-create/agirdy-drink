<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which drink are you? · 2x40+1</title>
<style>
@font-face{font-family:"Big Shoulders Display";src:url(BigShouldersDisplay.ttf) format("truetype");font-weight:100 900;font-display:swap}
@font-face{font-family:"Source Serif 4";src:url(SourceSerif4.ttf) format("truetype");font-weight:200 900;font-style:normal;font-display:swap}
@font-face{font-family:"Source Serif 4";src:url(SourceSerif4-Italic.ttf) format("truetype");font-weight:200 900;font-style:italic;font-display:swap}
:root{
  --bg:#1B2631; --deep:#121A23; --ink:#F3ECDD; --muted:#9FAAB3; --brass:#C9A15B; --line:rgba(201,161,91,.32);
  --row:rgba(243,236,221,.04); --glass:rgba(243,236,221,.62); --btn:#F3ECDD; --btnink:#1B2631; --cink:#1B2631;
  --glow:rgba(201,161,91,.20);
  --citrus:#F5C842; --spirit:#D4883A; --syrup:#D2416A; --fizz:#6FD3C9;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#ECEBE6; --deep:#1B2631; --ink:#1B2631; --muted:#5D6872; --brass:#94702F; --line:rgba(148,112,47,.38);
    --row:rgba(27,38,49,.045); --glass:rgba(27,38,49,.5); --btn:#1B2631; --btnink:#F3ECDD; --glow:rgba(201,161,91,.28);
    --citrus:#EDBB24; --spirit:#C9772A; --syrup:#C7345D; --fizz:#3DB8AD;
  }
}
:root[data-theme="dark"]{
  --bg:#1B2631; --deep:#121A23; --ink:#F3ECDD; --muted:#9FAAB3; --brass:#C9A15B; --line:rgba(201,161,91,.32);
  --row:rgba(243,236,221,.04); --glass:rgba(243,236,221,.62); --btn:#F3ECDD; --btnink:#1B2631; --glow:rgba(201,161,91,.20);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--serif);font-size:17.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:radial-gradient(90% 420px at 50% -60px,var(--glow),transparent 75%),var(--bg);background-repeat:no-repeat;background-color:var(--bg)}
.app{max-width:440px;margin:0 auto;padding:0 22px}
.screen{display:none}
.screen.on{display:flex;flex-direction:column;min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));animation:fade .35s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grow{flex:1}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0 12px;border-bottom:1px solid var(--line);margin-bottom:22px}
.mark{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.01em;white-space:nowrap}
.mark small{font-family:var(--serif);font-weight:400;font-style:italic;font-size:14px;color:var(--muted);margin-left:8px;letter-spacing:0}
.lnk{background:none;border:0;padding:10px 0;min-height:44px;color:var(--brass);font:inherit;font-size:15px;font-style:italic;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.lnk:hover{color:var(--ink)}
.right{display:flex;align-items:center;gap:14px}
.lang{display:flex;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);font-family:var(--display);font-weight:800;font-size:14px;padding:6px 11px;min-height:32px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brass);color:var(--bg)}
.display{font-family:var(--display);font-weight:900;line-height:.92;margin:0}
h1.display{font-size:clamp(54px,16vw,76px)}
h2.display{font-size:clamp(36px,11vw,44px);line-height:.95;margin-bottom:12px}
.kicker{font-style:italic;color:var(--muted);margin:0 0 4px}
p{margin:0 0 14px}
.muted{color:var(--muted)}
.sm{font-size:15px}
svg.glass{display:block;height:auto;overflow:visible}
.pour{animation:pour .7s cubic-bezier(.2,.75,.25,1) both}
@keyframes pour{from{transform:translateY(40px)}to{transform:none}}
.wave{animation:wave 2.6s linear infinite}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.bubble{animation:rise var(--t,3s) ease-in infinite;animation-delay:var(--dl,0s);opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(var(--d,-150px));opacity:0}}
.ice{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(3px) rotate(4deg)}}
/* bottom action bar: thumb zone */
.cta{position:sticky;bottom:0;margin:18px -22px 0;padding:14px 22px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 32%);z-index:5}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:999px;background:var(--btn);color:var(--btnink);font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.01em;padding:12px 20px 14px;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.3;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.cta .note{text-align:center;font-size:13px;font-style:italic;color:var(--muted);margin:10px 0 0}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
/* start */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:6px;margin:6px 0 18px}
.lead{font-size:19px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:18px 0 0}
.meta div{padding:10px 0;font-size:14px;color:var(--muted)}
.meta div+div{border-left:1px solid var(--line);padding-left:12px}
.meta b{display:block;font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink);line-height:1.1}
/* quiz */
.steps{display:flex;gap:5px;margin:0 0 20px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.steps i.done{background:var(--brass)}
.steps i.now{background:var(--ink)}
.qhead{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:end}
.qnum{font-family:var(--display);font-weight:800;font-size:18px;color:var(--brass);margin-bottom:6px}
.qtext{font-family:var(--display);font-weight:800;font-size:clamp(27px,8vw,32px);line-height:1.02;margin:0}
.opts{margin-top:auto;padding-top:24px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.opt{display:grid;grid-template-columns:22px 1fr;gap:14px;align-items:center;width:100%;min-height:60px;text-align:left;background:var(--row);border:0;border-radius:16px;margin-top:8px;padding:14px 16px;color:var(--ink);font:inherit;font-size:18px;line-height:1.3;cursor:pointer;transition:background .15s,transform .12s}
.opt:active{transform:scale(.98)}
.opt .o{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--brass);transition:background .15s,box-shadow .15s,transform .25s}
.opt.picked{background:rgba(201,161,91,.16)}
.opt.picked .o{box-shadow:none;transform:scale(1.3)}
.opts.locked .opt:not(.picked){opacity:.35}
/* mixing */
.mixing{flex:1;display:grid;place-items:center;text-align:center}
.shaker{width:110px;height:auto;animation:shake .32s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(-14deg) translateY(0)}50%{transform:rotate(14deg) translateY(-8px)}}
.mixing p{font-family:var(--display);font-weight:800;font-size:28px;margin-top:22px}
/* story card */
.story{position:relative;border-radius:24px;overflow:hidden;background:var(--deep);color:#F3ECDD;padding:22px 22px 18px;display:grid;gap:4px;
  box-shadow:0 0 0 1px rgba(201,161,91,.35)}
.story::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 55% at 50% 62%,var(--tc),transparent 70%);opacity:.38;pointer-events:none}
.story>*{position:relative}
.story .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-style:italic;color:rgba(243,236,221,.7)}
.story .row b{font-family:var(--display);font-style:normal;font-weight:900;font-size:18px;color:#F3ECDD}
.story .k{font-style:italic;color:rgba(243,236,221,.75);margin:18px 0 0}
.story .name{font-family:var(--display);font-weight:900;font-size:clamp(76px,25vw,112px);line-height:.82;margin:0;color:var(--tc)}
.story .gl{display:flex;justify-content:center;margin:14px 0 6px}
.story .recipe li{color:#F3ECDD}
.story .recipe .lead-dots{border-color:rgba(201,161,91,.45)}
.reveal .name{animation:stamp .7s cubic-bezier(.2,1.4,.4,1) .15s both}
.reveal .gl{animation:fade .6s ease .45s both}
@keyframes stamp{from{transform:scale(1.25);opacity:0}to{transform:none;opacity:1}}
.shot{text-align:center;font-size:13px;font-style:italic;color:var(--muted);margin:10px 0 0}
.recipe{list-style:none;margin:0;padding:0}
.recipe li{display:flex;align-items:baseline;gap:8px;padding:3px 0}
.recipe li .lead-dots{flex:1;border-bottom:1.5px dotted var(--line);transform:translateY(-4px)}
.recipe .sw{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;transform:translateY(-1px)}
.recipe .amt{font-family:var(--display);font-weight:800;font-size:20px}
.section{border-top:1px solid var(--line);padding-top:14px;margin-top:20px}
.section h3{font-family:var(--display);font-weight:800;font-size:22px;margin:0 0 6px}
.coasterrow{display:grid;grid-template-columns:88px 1fr;gap:16px;align-items:center}
.coasterrow svg{width:88px;height:88px}
/* team */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 4px}
.chip{background:none;border:0;padding:0;cursor:pointer;display:grid;justify-items:center;min-height:44px}
.chip svg{width:100%;max-width:84px;height:auto;transition:transform .2s}
.chip:active svg{transform:scale(.92) rotate(-8deg)}
.table{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 18px}
.seat{position:relative}
.seat svg{width:62px;height:62px;display:block}
.seat.empty{width:62px;height:62px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;color:var(--muted);font-size:13px;font-style:italic}
.seat button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:16px;line-height:28px;cursor:pointer;padding:0}
.seatlbl{font-size:12px;font-style:italic;color:var(--muted);text-align:center;margin-top:3px}
.hint{font-style:italic;color:var(--muted);min-height:1.5em;margin:10px 0 0}
/* wheel */
.wheelwrap{display:flex;justify-content:center;margin:4px 0}
.wheel{width:100%;max-width:340px;height:auto}
.seg path{fill:var(--row);stroke:var(--line);stroke-width:1.2;transition:fill .25s}
.seg text{fill:var(--ink);font-family:var(--display);font-weight:800;font-size:16px;pointer-events:none;transition:fill .25s}
.seg{cursor:pointer;outline:none}
.seg:hover path{fill:rgba(201,161,91,.14)}
.seg.on path{fill:var(--brass)}
.seg.on text{fill:var(--bg)}
.seg:focus-visible path{stroke:var(--brass);stroke-width:3}
/* challenge */
.pair{padding:12px 0;border-bottom:1px solid var(--line)}
.pair b{font-family:var(--display);font-weight:800;font-size:22px;display:block;line-height:1.1;margin-bottom:4px}
.pair span{font-style:italic;color:var(--muted);font-size:16px}
.slip{margin-top:18px;background:var(--row);border-radius:14px;padding:14px 16px 10px;box-shadow:inset 0 0 0 1px var(--line)}
.slip label{font-family:var(--display);font-weight:800;font-size:18px;color:var(--brass);display:block;margin-bottom:4px}
textarea{width:100%;min-height:92px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;font-style:italic;resize:vertical;padding:0;outline:none;line-height:1.5}
textarea::placeholder{color:var(--muted);opacity:.75}
.count{text-align:right;font-size:13px;color:var(--muted)}
/* done */
.ticket{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin:16px 0}
.ticket .t{font-family:var(--display);font-weight:800;font-size:20px;color:var(--brass)}
.ticket p{font-style:italic;font-size:19px;margin:4px 0 0}
/* flow */
.tl{list-style:none;padding:0;margin:18px 0 0}
.tl li{display:grid;grid-template-columns:90px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.tl time{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;color:var(--brass)}
.tl time.w{font-size:22px}
.tl b{font-family:var(--display);font-weight:800;font-size:21px;display:block;line-height:1.1;margin-bottom:4px}
.tl p{margin:0;font-size:15.5px;color:var(--muted)}
.needs{margin:6px 0 0;padding-left:18px}
.needs li{margin:4px 0;font-size:16px}
.ing{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:8px 0}
.ing svg{width:52px;height:52px}
.ing b{font-family:var(--display);font-weight:800;font-size:20px;display:block;line-height:1}
.ing span{font-size:15px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 8px;border-radius:999px;background:var(--row);box-shadow:inset 0 0 0 1px var(--line);font-size:16px}
.pill i{width:9px;height:9px;border-radius:50%;display:inline-block}
.dmeta{text-align:center;font-style:italic;color:var(--muted);margin:6px 0 0;font-size:16px}
.rise{animation:rise2 1.1s cubic-bezier(.25,.8,.3,1) .15s both}
@keyframes rise2{from{transform:translateY(var(--h,150px))}to{transform:none}}
.dl{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dl svg{width:44px;height:auto}
.dl b{font-family:var(--display);font-weight:800;font-size:19px;display:block;line-height:1.1}
.dl span{font-size:14.5px;color:var(--muted)}
.src{font-size:12.5px;font-style:italic;color:var(--muted);text-align:center;margin:6px 0 0}
.story .ai{margin-top:10px;padding-top:10px;border-top:1px dotted rgba(201,161,91,.45);font-size:14px;color:rgba(243,236,221,.75);font-style:italic}
.story .ai b{font-family:var(--display);font-style:normal;font-weight:800;font-size:18px;color:#F3ECDD;display:block}
.mine{margin:0 0 4px;font-size:16px}
.mine b{font-family:var(--display);font-weight:800;font-size:19px}
.versions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:12px}
.versions .vlbl{width:100%;text-align:center;font-size:14px;font-style:italic;color:var(--muted)}
.versions button{border:0;border-radius:999px;padding:8px 16px;min-height:40px;background:var(--row);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-family:var(--display);font-weight:800;font-size:17px;cursor:pointer}
.versions button[aria-pressed="true"]{background:var(--brass);color:var(--bg);box-shadow:none}
#tname .zh{display:block;font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;font-weight:600;font-size:26px;color:var(--brass);margin-top:10px;line-height:1}
.foot{font-size:13px;font-style:italic;color:var(--muted);text-align:center;margin:26px 0 30px}
@media (prefers-reduced-motion: reduce){
  .rise,.pour,.wave,.bubble,.ice,.screen.on,.shaker,.reveal .name,.reveal .gl{animation:none}
  .bubble{opacity:0}
}
</style>
</head>
<body>
<div class="app">

<section class="screen on" id="s-start">
  <div class="bar"><span class="mark">2x40+1<small data-t="hall"></small></span>
    <span class="right"><span class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="de">DE</button></span><button class="lnk" data-go="s-flow" data-t="flow"></button></span></div>
  <div class="hero"><h1 class="display" data-t="start_h"></h1><div id="g-start"></div></div>
  <p class="lead" data-t="start_p"></p>
  <div class="meta"><div><b>8</b><span data-t="m_q"></span></div><div><b>4</b><span data-t="m_i"></span></div><div><b>3</b><span data-t="m_t"></span></div></div>
  <div class="grow"></div>
  <div class="cta"><button class="btn" id="startBtn" data-t="start_btn"></button></div>
</section>

<section class="screen" id="s-quiz">
  <div class="bar"><span class="mark" id="qcount"></span><button class="lnk" id="backBtn" data-t="back"></button></div>
  <div class="steps" id="steps"></div>
  <div class="qhead"><div id="g-quiz"></div><div><div class="qnum" id="qnum"></div><h2 class="qtext" id="qtext"></h2></div></div>
  <div class="opts" id="opts"></div>
</section>

<section class="screen" id="s-mixing">
  <div class="mixing"><div>
    <svg class="shaker" viewBox="0 0 100 180" aria-hidden="true">
      <rect x="38" y="4" width="24" height="14" rx="5" fill="var(--brass)"/>
      <path d="M30 22 L70 22 L66 46 L34 46 Z" fill="var(--brass)"/>
      <path d="M26 50 L74 50 L64 172 Q63 176 59 176 L41 176 Q37 176 36 172 Z" fill="var(--glass)" fill-opacity=".9"/>
      <rect x="24" y="46" width="52" height="7" rx="3" fill="var(--brass)"/>
      <path d="M38 64 L42 160" stroke="#fff" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <p id="mixtext"></p></div></div>
</section>

<section class="screen" id="s-result">
  <div class="bar"><span class="mark" data-t="res_bar"></span><button class="lnk" id="redoBtn" data-t="redo"></button></div>
  <div class="story reveal" id="story">
    <div class="row"><b>2x40+1</b><span>17.10.2026</span></div>
    <p class="k" data-t="res_k"></p>
    <p class="name" id="rname"></p>
    <div class="gl" id="g-result"></div>
    <ul class="recipe" id="rrecipe"></ul>
    <div class="row" style="margin-top:10px"><span>AGIRDY</span><span>Maschinenhalle Süd</span></div>
  </div>
  <p class="shot" data-t="shot"></p>
  <p style="font-size:19px;margin-top:18px" id="rdesc"></p>
  <div class="section"><h3 data-t="ing_title"></h3><div class="pills" id="rpills"></div></div>
  <div class="section"><h3 data-t="role"></h3><p class="muted" id="rteam" style="margin:0"></p></div>
  <div class="section coasterrow"><div id="rcoaster"></div><p class="sm" style="margin:0" id="rcoasterp"></p></div>
  <div class="cta"><button class="btn" id="toWheel" data-t="to_wheel"></button></div>
</section>

<section class="screen" id="s-team">
  <div class="bar"><span class="mark" data-t="team_bar"></span><button class="lnk" data-go="s-result" data-t="back"></button></div>
  <h2 class="display" data-t="team_h"></h2>
  <p class="muted" data-t="team_p"></p>
  <p class="mine" id="mine"></p>
  <div class="table" id="table"></div>
  <div class="chips" id="chips"></div>
  <p class="hint" id="teamHint"></p>
  <div class="grow"></div>
  <div class="cta"><button class="btn" id="mixBtn" disabled data-t="mix_btn"></button></div>
</section>

<section class="screen" id="s-teamresult">
  <div class="bar"><span class="mark" data-t="res_bar"></span><button class="lnk" data-go="s-team" data-t="change"></button></div>
  <div style="display:flex;justify-content:center" id="g-team"></div>
  <p class="kicker" style="text-align:center;margin-top:10px" data-t="tres_k"></p>
  <p class="display" id="tname" style="text-align:center;font-size:clamp(58px,19vw,80px);line-height:.85"></p>
  <p class="dmeta" id="tmeta"></p>
  <div class="versions" id="versions"></div>
  <p id="tdesc" style="text-align:center;font-size:19px;margin-top:12px"></p>
  <div class="grow"></div>
  <div class="cta"><button class="btn" data-go="s-challenge" data-t="to_ch"></button></div>
</section>

<section class="screen" id="s-areas">
  <div class="bar"><span class="mark" data-t="wheel_bar"></span><button class="lnk" id="wheelBack" data-t="back"></button></div>
  <h2 class="display" data-t="wheel_h"></h2>
  <p class="muted" data-t="wheel_p"></p>
  <div class="wheelwrap" id="wheel"></div>
  <p class="src" data-t="wheel_src"></p>
  <div class="grow"></div>
  <div class="cta"><button class="btn" id="areasBtn" disabled></button></div>
</section>

<section class="screen" id="s-challenge">
  <div class="bar"><span class="mark" data-t="ch_bar"></span><button class="lnk" data-go="s-teamresult" data-t="back"></button></div>

    else{const cx=(rl+rr)/2;[[cx-24,G.top-6,-12],[cx+6,G.top+2,9],[cx-12,G.top+34,4]].forEach(([x,y,r])=>{liq+=`<rect class="ice" x="${x-16}" y="${y}" width="32" height="30" rx="6" fill="rgba(255,255,255,.2)" stroke="rgba(255,255,255,.55)" stroke-width="1.5" transform="rotate(${r} ${x} ${y+15})"/>`;});}
  }
  const inner=o.pour?`<g class="rise" style="--h:${G.bot-G.top+20}px">${liq}</g>`:liq;
  let stem="";
  if(G.stem) stem=`<path d="M120 ${G.stem[0]} L120 ${G.stem[1]}" stroke="${st}" stroke-width="4.5" stroke-linecap="round"/><ellipse cx="120" cy="${G.stem[1]+6}" rx="40" ry="7" fill="${st}" fill-opacity=".1" stroke="${st}" stroke-width="4"/>`;
  let rimx="";
  if(D.salt){for(let x=rl+4;x<=rr-4;x+=7) rimx+=`<circle cx="${x}" cy="${ry+1+(x%3)}" r="2.2" fill="#fff" opacity=".9"/>`;}
  let gar="";
  if(D.gar==="lime") gar=wheelG(rr-4,ry-2,"#8DBF3A");
  if(D.gar==="beans"){const cx=(rl+rr)/2,y=G.top+2;gar=[-16,0,16].map((d,i)=>`<g transform="rotate(${[-20,10,-5][i]} ${cx+d} ${y-(i===1?3:0)})"><ellipse cx="${cx+d}" cy="${y-(i===1?3:0)}" rx="6" ry="8.5" fill="#24130A"/><path d="M${cx+d} ${y-8-(i===1?3:0)} q-2 8 0 16" stroke="#6B4A33" stroke-width="1.4" fill="none"/></g>`).join("");}
  if(D.gar==="osmanthus") gar=`<g fill="#E8962A">${[[rr-10,ry-6],[rr-2,ry-12],[rr+4,ry-4],[rr-16,ry-14]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.4"/>`).join("")}</g><path d="M${rr-30} ${ry+2} q14 -22 34 -26" stroke="#5E7F3A" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  if(D.gar==="lemon") gar=wheelG(rr-4,ry-2,"#F2CC2E");
  if(D.gar==="orange") gar=wheelG(rr-4,ry-2,"#F08A24");
  if(D.gar==="grapefruit") gar=`<path d="M${rr-26} ${ry} A22 22 0 0 0 ${rr+18} ${ry} Z" fill="#E86A6A" stroke="rgba(255,255,255,.85)" stroke-width="2.5" transform="rotate(-25 ${rr-4} ${ry})"/>`;
  if(D.gar==="peel") gar=`<path d="M${rr-58} ${ry+6} q18 -26 50 -14 q10 4 14 14" fill="none" stroke="#F08A24" stroke-width="7" stroke-linecap="round"/>`;
  if(D.gar==="mint") gar=`<g fill="#4FA34A"><ellipse cx="${rl+30}" cy="${ry-14}" rx="9" ry="17" transform="rotate(-25 ${rl+30} ${ry-14})"/><ellipse cx="${rl+46}" cy="${ry-20}" rx="8" ry="15" transform="rotate(20 ${rl+46} ${ry-20})"/><ellipse cx="${rl+38}" cy="${ry-30}" rx="7" ry="13"/></g>`+wheelG(rr-4,ry-2,"#8DBF3A");
  return `<svg class="glass" style="width:${o.w||120}px" viewBox="0 0 240 300" role="img" aria-label="${D.name}">
   <defs><clipPath id="c${id}"><path d="${G.clip}"/></clipPath>
   <linearGradient id="sh${id}" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient></defs>
   <path d="${G.clip}" fill="${st}" fill-opacity=".07"/>
   <g clip-path="url(#c${id})">${inner}<rect x="0" y="0" width="240" height="300" fill="url(#sh${id})"/></g>
   <path d="${G.out}" fill="none" stroke="${st}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
   ${G.base?`<path d="${G.base}" stroke="${st}" stroke-width="2" opacity=".5"/>`:""}${stem}${rimx}${gar}</svg>`;
}
const comboKey=()=>{const all=[S.me,...S.mates];return ORDER.filter(k=>all.includes(k)).join("");};
const drinkKey=()=>S.pick||comboKey();
const AREAS=[
 ["body",{en:["Health","a break reminder that doesn't nag"],de:["Gesundheit","eine Pausen-Erinnerung, die nicht nervt"]}],
 ["emotions",{en:["Emotions","a one-minute evening check-in that asks how your day really was"],de:["Emotionen","ein Ein-Minuten-Check-in am Abend, der fragt, wie dein Tag wirklich war"]}],
 ["relationships",{en:["Relationships","a nudge to call friends and family you haven't spoken to in a while"],de:["Beziehungen","ein Anstoß, Freunde und Familie anzurufen, von denen man lange nichts gehört hat"]}],
 ["time",{en:["Time","an assistant that turns a messy week into a realistic plan"],de:["Zeit","ein Assistent, der eine chaotische Woche in einen realistischen Plan verwandelt"]}],
 ["career",{en:["Mission","a sparring partner that sharpens your next big idea"],de:["Mission","ein Sparringspartner, der deine nächste große Idee schärft"]}],
 ["finances",{en:["Finances","a calculator that shows where the money actually goes"],de:["Finanzen","ein Rechner, der zeigt, wohin das Geld eigentlich geht"]}],
 ["celebrate",{en:["Joy","a random generator for weekend adventures"],de:["Freude","ein Zufallsgenerator für Wochenend-Abenteuer"]}]
];
const S={lang:"en",answers:[],me:null,mates:[],areas:[],team:null};
const $=id=>document.getElementById(id);
const L=()=>UI[S.lang];
const byOrder=a=>[...a].sort((x,y)=>ORDER.indexOf(x)-ORDER.indexOf(y));
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}};
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
let uid=0;

/* ---------- drawing ---------- */
function glass(layers,slots,o={}){
  const id="g"+(++uid),B=258,H=216,unit=H/slots,n=layers.length,top=B-n*unit;
  let liq="";
  layers.forEach((t,i)=>{
    const y=B-(i+1)*unit,col=`var(${TYPES[t].c})`;
    if(i<n-1){liq+=`<rect x="0" y="${y}" width="240" height="${unit+1}" fill="${col}"/>`;}
    else{liq+=`<g class="${o.pour?'pour':''}"><rect x="0" y="${y+8}" width="240" height="${unit-7}" fill="${col}"/><g transform="translate(0 ${y})"><path class="wave" fill="${col}" d="M-120 0 q15 -4 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 L360 14 L-120 14 Z"/></g></g>`;}
  });
  if(n){
    liq+=`<rect x="0" y="${top}" width="240" height="${B-top}" fill="url(#sh${id})"/>`;
    for(let k=0;k<7;k++){liq+=`<circle class="bubble" cx="${62+((k*37)%118)}" cy="${B-6}" r="${1.4+(k%3)*.8}" fill="rgba(255,255,255,.75)" style="--d:${-(B-top-10)}px;--t:${2.4+(k%4)*.5}s;--dl:${k*.45}s"/>`;}
    if(o.ice){liq+=`<rect class="ice" x="78" y="${top-6}" width="38" height="36" rx="7" fill="rgba(255,255,255,.22)" stroke="rgba(255,255,255,.55)" stroke-width="1.5" transform="rotate(-12 97 ${top+12})"/><rect class="ice" style="animation-delay:-2s" x="124" y="${top-2}" width="34" height="32" rx="7" fill="rgba(255,255,255,.18)" stroke="rgba(255,255,255,.5)" stroke-width="1.5" transform="rotate(10 141 ${top+14})"/>`;}
  }
  let gar="";
  if(o.garnish){let s="";for(let k=0;k<8;k++){const a=k*Math.PI/4;s+=`<line x1="200" y1="26" x2="${(200+17*Math.cos(a)).toFixed(1)}" y2="${(26+17*Math.sin(a)).toFixed(1)}"/>`;}
    gar=`<circle cx="200" cy="26" r="24" fill="var(--citrus)"/><circle cx="200" cy="26" r="19" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2.5"/><g stroke="rgba(255,255,255,.75)" stroke-width="2">${s}</g>`;}
  const st=o.stroke||"var(--glass)";
  return `<svg class="glass" style="width:${o.w||120}px" viewBox="0 0 240 300" role="img" aria-label="Glass">
   <defs><clipPath id="c${id}"><path d="M37 24 L203 24 L191 262 L49 262 Z"/></clipPath>
   <linearGradient id="sh${id}" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient></defs>
   <path d="M30 18 L210 18 L197 270 Q196 284 182 284 L58 284 Q44 284 43 270 Z" fill="${st}" fill-opacity=".07"/>
   <g clip-path="url(#c${id})">${liq}</g>
   <path d="M30 18 L210 18 L197 270 Q196 284 182 284 L58 284 Q44 284 43 270 Z" fill="none" stroke="${st}" stroke-width="4.5" stroke-linejoin="round"/>
   <path d="M49 262 L191 262" stroke="${st}" stroke-width="2" opacity=".5"/>
   <path d="M55 44 L66 236" stroke="#fff" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>${gar}</svg>`;
}
function coaster(t){
  const id="r"+(++uid),T=TYPES[t];
  return `<svg viewBox="0 0 120 120" role="img" aria-label="${T.name}">
   <defs><path id="${id}" d="M60 60 m-49 0 a49 49 0 1 1 98 0 a49 49 0 1 1 -98 0"/></defs>
   <circle cx="60" cy="60" r="58" fill="var(${T.c})"/>
   <circle cx="60" cy="60" r="41" fill="none" stroke="var(--cink)" stroke-opacity=".28" stroke-width="1.2"/>
   <text font-family="Source Serif 4, Georgia, serif" font-size="7.2" letter-spacing="1.1" fill="var(--cink)" fill-opacity=".7"><textPath href="#${id}">2x40+1 · AGIRDY · MASCHINENHALLE SÜD · 17.10.2026 · </textPath></text>
   <text x="60" y="68" text-anchor="middle" font-family="Big Shoulders Display, Impact, sans-serif" font-weight="900" font-size="25" fill="var(--cink)">${T.name}</text></svg>`;
}

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=L()[el.dataset.t];});
  document.querySelectorAll("[data-th]").forEach(el=>{el.innerHTML=L()[el.dataset.th];});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===S.lang));
  $("idea").placeholder=L().ph;
  $("tl").innerHTML=L().tl.map(([t,b,p])=>`<li><time class="${t.length>5?'w':''}">${t}</time><div><b>${b}</b><p>${p}</p></div></li>`).join("");
  $("needs").innerHTML=L().needlist.map(x=>`<li>${x}</li>`).join("");
  $("flowTypes").innerHTML=ORDER.map(k=>`<div class="ing">${coaster(k)}<div><b>${TYPES[k].name}</b><span>${TYPES[k][S.lang].team}</span></div></div>`).join("");
  $("drinkList").innerHTML=Object.keys(DRINKS).map(k=>{const D=DRINKS[k];return `<div class="dl">${drink(k,{w:44})}<div><b>${D.name}</b><span>${(COMBO[k]||k).split("").map(t=>TYPES[t].name).join(" + ")}. ${GN[S.lang][D.glass]}: ${D[S.lang][0]}</span></div></div>`;}).join("");
  if(S.me) fillResult(false);
  if(S.team) fillTeamResult(false);
  if(S.areas&&S.areas.length) buildChallenge();
}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;applyLang();});

/* ---------- navigation ---------- */
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");window.scrollTo(0,0);}
let lastScreen="s-start";
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(!g)return;
  const cur=document.querySelector(".screen.on").id;
  if(g.dataset.go==="s-flow")lastScreen=cur;
  if(g.dataset.go==="s-team")renderTeam();
  if(g.dataset.go==="s-challenge")buildChallenge();
  buzz();show(g.dataset.go);
});
$("flowBack").onclick=()=>show(lastScreen);

/* ---------- quiz ---------- */
function order(i){const a=[...ORDER];let s=i*7919+13;for(let k=a.length-1;k>0;k--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function renderQuiz(pour){
  const i=S.answers.length,qs=Q[S.lang];
  if(i>=qs.length){mix();return;}
  $("qcount").textContent=`${i+1} / ${qs.length}`;
  $("qnum").textContent=L().qord[i];
  $("backBtn").style.visibility=i?"visible":"hidden";
  $("steps").innerHTML=qs.map((_,k)=>`<i class="${k<i?'done':k===i?'now':''}"></i>`).join("");
  $("qtext").textContent=qs[i][0];
  $("g-quiz").innerHTML=glass(S.answers,qs.length,{w:92,pour});
  const box=$("opts");box.innerHTML="";box.classList.remove("locked");
  order(i).forEach(k=>{
    const b=document.createElement("button");b.className="opt";
    b.innerHTML=`<span class="o"></span><span></span>`;b.lastChild.textContent=qs[i][1][k];
    b.onclick=()=>{
      if(box.classList.contains("locked"))return;
      buzz();box.classList.add("locked");b.classList.add("picked");
      b.querySelector(".o").style.background=`var(${TYPES[k].c})`;
      setTimeout(()=>{S.answers.push(k);renderQuiz(true);},calm?120:360);
    };
    box.appendChild(b);
  });
}
$("startBtn").onclick=()=>{buzz();S.answers=[];renderQuiz();show("s-quiz");};
$("backBtn").onclick=()=>{S.answers.pop();renderQuiz();};
$("wheelBack").onclick=()=>show("s-result");
$("redoBtn").onclick=()=>{Object.assign(S,{answers:[],me:null,mates:[],areas:[],team:null});renderQuiz();show("s-quiz");};

function mix(){
  const c={C:0,S:0,Y:0,F:0};S.answers.forEach(a=>c[a]++);
  const max=Math.max(...Object.values(c)),tied=ORDER.filter(k=>c[k]===max);
  let me=tied[0];for(let i=S.answers.length-1;i>=0;i--){if(tied.includes(S.answers[i])){me=S.answers[i];break;}}
  S.me=me;S.counts=c;
  $("mixtext").textContent=L().mixing;show("s-mixing");
  setTimeout(()=>{fillResult(true);show("s-result");try{navigator.vibrate&&navigator.vibrate([20,40,30])}catch(e){}},calm?300:1500);
}
function fillResult(anim){
  const T=TYPES[S.me],c=S.counts,story=$("story");
  story.style.setProperty("--tc",`var(${T.c})`);
  if(anim){story.classList.remove("reveal");void story.offsetWidth;story.classList.add("reveal");}
  $("rname").textContent=T.name;
  $("g-result").innerHTML=glass(byOrder(S.answers),8,{w:150,ice:true,stroke:"rgba(243,236,221,.7)"});
  $("rrecipe").innerHTML=ORDER.filter(k=>c[k]).sort((a,b)=>c[b]-c[a]).map(k=>
    `<li><span><span class="sw" style="background:var(${TYPES[k].c})"></span>${TYPES[k].name}</span><span class="lead-dots"></span><span class="amt">${c[k]} cl</span></li>`).join("");
  $("rdesc").textContent=T[S.lang].desc;
  $("rpills").innerHTML=T.ex[S.lang].map(x=>`<span class="pill"><i style="background:var(${T.c})"></i>${x}</span>`).join("");$("rteam").textContent=T[S.lang].team;
  $("rcoaster").innerHTML=coaster(S.me);$("rcoasterp").innerHTML=L().coaster(T[S.lang].color);
}

/* ---------- team ---------- */
function renderTeam(){
  $("mine").innerHTML=`${L().mine} <b>${AREAS.filter(a=>(S.areas||[]).includes(a[0])).map(a=>a[1][S.lang][0]).join(" + ")}</b>`;
  const seats=[`<div><div class="seat">${coaster(S.me)}</div><div class="seatlbl">${L().you}</div></div>`];
  S.mates.forEach((k,i)=>seats.push(`<div><div class="seat">${coaster(k)}<button aria-label="Remove ${TYPES[k].name}" data-rm="${i}">×</button></div><div class="seatlbl">${TYPES[k].name}</div></div>`));
  for(let i=S.mates.length;i<2;i++)seats.push(`<div><div class="seat empty">${L().open}</div></div>`);
  $("table").innerHTML=seats.join("");
  $("table").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{buzz();S.mates.splice(+b.dataset.rm,1);renderTeam();});
  $("chips").innerHTML="";
  ORDER.forEach(k=>{
    const b=document.createElement("button");b.className="chip";b.innerHTML=coaster(k);b.setAttribute("aria-label","Add "+TYPES[k].name);
    b.onclick=()=>{if(S.mates.length<2){buzz();S.mates.push(k);renderTeam();}};
    $("chips").appendChild(b);
  });
  const d=new Set([S.me,...S.mates]).size;
  $("teamHint").textContent=!S.mates.length?L().h0:d===1?L().h1:S.mates.length===1?L().h2:L().h3;
  $("mixBtn").disabled=!(S.mates.length&&d>=2);
}
function fillTeamResult(anim){
  const k=drinkKey(),D=DRINKS[k],c=comboKey(),alt=ALT[c];
  S.team=D.name;$("tname").innerHTML=D.name+(D.zh?`<span class="zh">${D.zh}</span>`:"");
  $("tname").style.fontSize=D.name.length>12?"clamp(46px,14vw,62px)":"";
  $("tmeta").textContent=`${GN[S.lang][D.glass]}: ${D[S.lang][0]}`;
  $("tdesc").textContent=D[S.lang][1];
  $("g-team").innerHTML=drink(k,{w:200,pour:anim});
  $("versions").innerHTML=alt?`<span class="vlbl">${L().version}</span>`+[c,alt].map(x=>`<button aria-pressed="${x===k}" data-v="${x}">${DRINKS[x].name}</button>`).join(""):"";
  $("versions").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{buzz();S.pick=b.dataset.v===c?null:b.dataset.v;fillTeamResult(true);});
}
$("mixBtn").onclick=()=>{buzz();S.pick=null;$("mixtext").textContent=L().mixing_team;show("s-mixing");setTimeout(()=>{fillTeamResult(true);show("s-teamresult");try{navigator.vibrate&&navigator.vibrate([20,40,30])}catch(e){}},calm?300:1300);};

/* ---------- wheel of life ---------- */
function label(t,x,y){
  const p=t.split(" & ");
  if(p.length===2) return `<text x="${x}" y="${y}" text-anchor="middle" style="font-size:14px"><tspan x="${x}" dy="-2">${p[0]} &amp;</tspan><tspan x="${x}" dy="16">${p[1]}</tspan></text>`;
  return `<text x="${x}" y="${y+5}" text-anchor="middle" style="font-size:${t.length>9?14:16}px">${t}</text>`;
}
function renderWheel(){
  const cx=170,cy=170,R=162,r=52,n=AREAS.length,pt=(rad,a)=>[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];
  let segs="";
  AREAS.forEach(([id,txt],i)=>{
    const a0=-Math.PI/2+(i-.5)*2*Math.PI/n+.012,a1=-Math.PI/2+(i+.5)*2*Math.PI/n-.012,am=(a0+a1)/2;
    const [x0,y0]=pt(R,a0),[x1,y1]=pt(R,a1),[x2,y2]=pt(r,a1),[x3,y3]=pt(r,a0),[lx,ly]=pt((R+r)/2+6,am);
    const on=S.areas.includes(id);
    segs+=`<g class="seg${on?' on':''}" role="button" tabindex="0" aria-pressed="${on}" data-a="${id}"><path d="M${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 0 0 ${x3} ${y3} Z"/>${label(txt[S.lang][0],lx,ly)}</g>`;
  });
  $("wheel").innerHTML=`<svg class="wheel" viewBox="0 0 340 340" aria-label="Wheel of Life">${segs}
    <text x="${cx}" y="${cy+4}" text-anchor="middle" font-family="Big Shoulders Display, Impact, sans-serif" font-weight="900" font-size="32" fill="var(--brass)">${S.areas.length}/2</text>
    <text x="${cx}" y="${cy+22}" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="12" fill="var(--muted)">${L().chosen}</text></svg>`;
  $("wheel").querySelectorAll(".seg").forEach(g=>{
    const t=()=>{const id=g.dataset.a;buzz();
      if(S.areas.includes(id))S.areas=S.areas.filter(x=>x!==id);else if(S.areas.length<2)S.areas.push(id);
      renderWheel();const f=$("wheel").querySelector(`[data-a="${id}"]`);f&&f.focus({preventScroll:true});};
    g.addEventListener("click",t);
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();t();}});
  });
  $("areasBtn").disabled=S.areas.length<1;
  $("areasBtn").textContent=S.areas.length<1?L().min1:L().find_team;
}
$("toWheel").onclick=()=>{buzz();S.areas=S.areas||[];renderWheel();show("s-areas");};
$("areasBtn").onclick=()=>{if(!S.areas.length)return;buzz();renderTeam();show("s-team");};
function buildChallenge(){
  const sel=AREAS.filter(a=>S.areas.includes(a[0])).map(a=>a[1][S.lang]);
  $("pairs").innerHTML=sel.map(a=>`<div class="pair"><b>${a[0]}</b><span>${L().ex(a[1])}</span></div>`).join("");
}
$("idea").addEventListener("input",()=>{const v=$("idea").value;$("ideaCount").textContent=v.length;$("submitBtn").disabled=v.trim().length<8;});
$("submitBtn").onclick=()=>{
  buzz();
  $("dTeam").textContent=L().team+" "+S.team;$("dIdea").textContent=$("idea").value.trim();
  $("g-done").innerHTML=drink(drinkKey(),{w:150});
  show("s-done");
};
$("restartBtn").onclick=()=>{Object.assign(S,{answers:[],me:null,mates:[],areas:[],team:null});$("idea").value="";$("ideaCount").textContent="0";$("submitBtn").disabled=true;show("s-start");};

$("g-start").innerHTML=glass(["S","Y","C","F"],5,{w:120,ice:true,garnish:true});
applyLang();
</script>
